<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel — 92 factory</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..900;1,14..32,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- LOGIN -->
  <section class="auth" id="auth" hidden>
    <div class="auth__glow"></div>
    <form class="auth__card" id="authForm" novalidate>
      <div class="auth__logo"><img src="img/logo-official.png" alt="92 factory"></div>
      <h1 id="authTitle">Painel administrador</h1>
      <p class="muted" id="authSub">Entre com seu e-mail e senha.</p>
      <label class="fl"><span>E-mail</span><input type="email" id="aEmail" autocomplete="email" required></label>
      <label class="fl"><span>Senha</span><input type="password" id="aPass" autocomplete="current-password" required minlength="8"></label>
      <button class="btn btn--orange btn--block" id="authBtn" type="submit">Entrar</button>
      <p class="auth__msg" id="authMsg" role="status"></p>
      <button type="button" class="linkbtn" id="authToggle" hidden>Primeiro acesso? Criar conta de administrador</button>
      <a href="index.html" class="linkbtn">← Voltar ao site</a>
    </form>
  </section>

  <!-- APP -->
  <div class="app" id="app" hidden>
    <aside class="side" id="side">
      <a href="index.html" target="_blank" class="side__logo"><img src="img/logo-official.png" alt="92 factory"></a>
      <nav class="side__nav">
        <a href="#dashboard" data-v="dashboard"><svg viewBox="0 0 24 24"><path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/></svg>Dashboard</a>
        <a href="#leads" data-v="leads"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M17 11h6M20 8v6"/></svg>Leads <b class="badge" id="leadBadge" hidden>0</b></a>
        <a href="#produtos" data-v="produtos"><svg viewBox="0 0 24 24"><path d="M20 7 12 3 4 7v10l8 4 8-4z"/><path d="m4 7 8 4 8-4M12 11v10"/></svg>Produtos</a>
        <a href="#lookbook" data-v="lookbook"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>Lookbook</a>
        <a href="#conteudo" data-v="conteudo"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Conteúdo do site</a>
        <a href="#config" data-v="config"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Configurações</a>
      </nav>
      <div class="side__foot">
        <a href="index.html" target="_blank" class="side__site">Ver site ↗</a>
        <button class="side__out" id="logout">Sair</button>
      </div>
    </aside>
    <div class="main">
      <header class="top">
        <button class="top__burger" id="sideToggle" aria-label="Menu"><span></span><span></span></button>
        <h1 id="viewTitle">Dashboard</h1>
        <div class="top__right" id="topRight"></div>
      </header>
      <main class="view" id="view"></main>
    </div>
  </div>

  <div class="modal" id="modal" hidden><div class="modal__box" id="modalBox"></div></div>
  <div class="toast" id="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
